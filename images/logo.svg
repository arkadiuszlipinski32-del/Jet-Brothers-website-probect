<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" fill="none">
  <!-- J -->
  <text x="14" y="72" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="68" fill="#ffffff" letter-spacing="-2">J</text>
  <!-- 3 in gold -->
  <text x="46" y="72" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="68" fill="#f5a623" letter-spacing="-2">3</text>

  <!-- Pressure washer lance: diagonal line from top-left of 3 upward-right -->
  <g transform="translate(38, 8) rotate(-32)">
    <!-- lance body -->
    <rect x="0" y="0" width="38" height="5" rx="2.5" fill="#ffffff"/>
    <!-- nozzle tip -->
    <rect x="36" y="-1" width="8" height="7" rx="2" fill="#f5a623"/>
    <!-- spray lines -->
    <line x1="46" y1="1"  x2="58" y2="-6"  stroke="#f5a623" stroke-width="2" stroke-linecap="round"/>
    <line x1="46" y1="3"  x2="60" y2="3"   stroke="#f5a623" stroke-width="2" stroke-linecap="round"/>
    <line x1="46" y1="5"  x2="58" y2="10"  stroke="#f5a623" stroke-width="2" stroke-linecap="round"/>
    <line x1="46" y1="0"  x2="55" y2="-10" stroke="#f5a623" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="46" y1="6"  x2="55" y2="14"  stroke="#f5a623" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Divider line -->
  <line x1="102" y1="18" x2="102" y2="76" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- JET BROTHERS -->
  <text x="112" y="52" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="26" fill="#ffffff" letter-spacing="1">JET BROTHERS</text>

  <!-- Decorative lines + ABERDEEN -->
  <line x1="112" y1="64" x2="130" y2="64" stroke="#f5a623" stroke-width="1.5"/>
  <text x="134" y="68" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#f5a623" letter-spacing="3">ABERDEEN</text>
  <line x1="228" y1="64" x2="310" y2="64" stroke="#f5a623" stroke-width="1.5"/>
</svg>
